<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>АИС Допобразование Web</title>
    <link rel="icon" href="favicon.ico" type="image/png">
    <link rel="shortcut icon" href="favicon.ico" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20260830-record-lock-readonly-wait-v1">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="auth-screen" data-startup-fallback style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf4ef;color:#1f2926;font-family:'Segoe UI',Arial,sans-serif">
        <section class="auth-card auth-loading-card" style="max-width:420px;padding:28px;border:1px solid #d9e0dc;border-radius:16px;background:#fff;text-align:center;box-shadow:0 14px 34px rgba(31,41,38,.08)">
          <strong style="display:block;margin-bottom:8px;font-size:20px">Запуск АИС…</strong>
          <span data-startup-message>Проверка локального сервера и доступа.</span>
        </section>
      </main>
      <noscript>Для работы системы нужен включенный JavaScript.</noscript>
    </div>
  <script>
    (() => {
      const build = "20260830-record-lock-readonly-wait-v1";
      const message = document.querySelector("[data-startup-message]");
      const fail = (error) => {
        if (!message?.isConnected) return;
        const details = String(error?.message || error || "неизвестная ошибка").trim();
        message.textContent = `Не удалось загрузить интерфейс: ${details}`;
      };
      const request = new XMLHttpRequest();
      request.open("GET", `auth-bootstrap.js?v=${encodeURIComponent(build)}&transport=xhr`, true);
      request.setRequestHeader("Cache-Control", "no-cache");
      request.onload = () => {
        if (request.status < 200 || request.status >= 300) {
          fail(`сервер вернул HTTP ${request.status}`);
          return;
        }
        const script = document.createElement("script");
        script.textContent = `${request.responseText}\n//# sourceURL=auth-bootstrap.js`;
        const runtimeError = (event) => fail(event.error || event.message);
        window.addEventListener("error", runtimeError, { once: true });
        document.body.appendChild(script);
        window.setTimeout(() => {
          if (!document.querySelector("[data-startup-fallback]")) {
            window.removeEventListener("error", runtimeError);
          } else {
            fail("стартовый модуль не выполнился");
          }
        }, 0);
      };
      request.onerror = () => fail("нет соединения с локальным сервером");
      request.send();
    })();
  </script>
  </body>
</html>
